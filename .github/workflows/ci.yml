name: ci

# DP-602 — deterministic contributor acceptance.
#
# This workflow never publishes, releases, deploys, or contacts a production
# database, a paid provider, or a MiniPC host. It is read-only on the repository
# and runs only checks that are a pure function of the committed tree: no network
# data source, no credentials, no PostgreSQL.
#
# Every branch push still gets the lightweight DP-602 repository contract.
# Run the full 8-backend build matrix only for PRs and main integration, not
# both the push and pull_request events for the same change branch.
# Local `python3 tools/check_contributor_acceptance.py` remains the deterministic
# contributor-side equivalent for repository-contract checks.

on:
  push:
  pull_request:

# Least privilege. No write, no packages, no issues, no deployments.
permissions:
  contents: read

# controlcenter#413: cancel the superseded run for the same PR or main ref so an
# outdated commit stops instead of occupying a hosted runner. The event name is
# part of the group so a push run never cancels a pull_request run whose required
# checks still have to report.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-minimal:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    name: backend ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # controlcenter#418: one mandatory macOS backend (latest Python), while
        # every supported Python continues to run the full backend gate on Ubuntu.
        exclude:
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v5
        with:
          # Two commits so `git diff --check` has a base; see the first-commit policy
          # in tools/check_contributor_acceptance.py.
          fetch-depth: 2

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Record tool versions
        run: |
          python -VV
          uname -a
          git --version

      - name: Build the distribution (proves the packaging contract)
        run: |
          python -m pip install --upgrade "pip>=24,<26" "build>=1.2,<2.0" "packaging>=24,<26" "setuptools>=68,<81" "wheel>=0.44,<0.46"
          python -m build --outdir dist-ci

      - name: Install into a fresh environment and smoke the import/CLI contract
        run: |
          python -m venv .venv-ci
          .venv-ci/bin/python -m pip install --upgrade "pip>=24,<26"
          .venv-ci/bin/python -m pip install dist-ci/*.whl
          .venv-ci/bin/python -c "import dichiarazioni_pubbliche; print('import ok:', dichiarazioni_pubbliche.__file__)"
          # Every module must import from the install, with no repo on sys.path.
          .venv-ci/bin/python -c "import importlib, pkgutil, dichiarazioni_pubbliche; \
            [importlib.import_module('dichiarazioni_pubbliche.'+m.name) for m in pkgutil.iter_modules(dichiarazioni_pubbliche.__path__)]; \
            print('all modules import ok')"
          # Data-backed commands take an explicit path outside the install.
          .venv-ci/bin/python -m dichiarazioni_pubbliche.benchmark --fixtures "$PWD/poc/fixtures/italian_cases.json"
          .venv-ci/bin/dichiarazioni-pubbliche-review-admin --help > /dev/null
          echo "console script ok"

      # DP-419 tests decode original captured audio; hosted images do not
      # guarantee ffmpeg/ffprobe. Run the full decoder assertions on each OS.
      - name: Install original-media test decoder
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install ffmpeg
          else
            # The Azure apt mirror has repeatedly stalled during the ffmpeg download.
            # Use Ubuntu's official archive on ephemeral GitHub-hosted runners.
            sudo sed -i \
              -e 's@mirror+file:/etc/apt/apt-mirrors.txt@http://archive.ubuntu.com/ubuntu@g' \
              -e 's@http://azure.archive.ubuntu.com/ubuntu@http://archive.ubuntu.com/ubuntu@g' \
              /etc/apt/sources.list.d/ubuntu.sources
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffprobe -version | head -1

      - name: Compile
        run: python -m compileall -q poc tests

      - name: Unit and regression tests
        # Strict disposable PostgreSQL diagnostics; witness samples no SQL or identities.
        env:
          DP514_CI_PG_DIAGNOSTIC: "1"
          DP514_CI_PG_WAIT_WITNESS: "1"
        run: PYTHONPATH=poc python -m unittest discover -s tests -v

      - name: DP438 public Person API, rotated rights pins and static withdrawal
        run: PYTHONPATH=poc python -m unittest tests.test_dp438_public_person_api -v

      - name: Real JFK Ogg to disposable PostgreSQL and private HTTP acceptance
        shell: bash
        run: |
          set -euo pipefail
          media="$RUNNER_TEMP/dp419-jfk-original.ogg"
          curl --fail --location --silent --show-error --retry 2 --max-time 120 \
            'https://upload.wikimedia.org/wikipedia/commons/5/50/Jfk_rice_university_we_choose_to_go_to_the_moon.ogg' \
            --output "$media"
          DP419_REAL_MEDIA_PATH="$media" PYTHONPATH=poc python -m unittest tests.test_dp419_real_media_pg_acceptance -v

      - name: Optional Google OIDC account extra security tests
        # The contributor profile above stays dependency-free. Validate the
        # explicitly optional Authlib account feature separately on every
        # supported Python and runner without any live Google credentials.
        run: |
          python -m pip install ".[account]"
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=poc python -m unittest tests.test_public_account tests.test_authlib_google_oidc -v

      - name: Deterministic benchmark
        run: PYTHONPATH=poc python -m dichiarazioni_pubbliche.benchmark

      # controlcenter#418: static acceptance is required once in repository-contract.
      # Keep the full package, unit/extra and benchmark profile on every OS/Python;
      # do not occupy each scarce macOS slot repeating OS-independent tree checks.

      - name: Reject whitespace errors
        run: |
          git diff --check
          # With fetch-depth 2 the range base exists; fall back to the working tree
          # for a single-commit repository (first-commit policy).
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            echo "single-commit checkout: base-diff whitespace check skipped, working-tree check ran"
          fi

      - name: Assert the tree was not modified by the build
        run: |
          # Generated output must never land in the source tree.
          status=$(git status --porcelain --untracked-files=normal | \
            grep -Ev '^\?\? (\.venv-ci|dist-ci|web/node_modules)/' || true)
          if [ -n "$status" ]; then
            echo "::error::setup/build modified the source tree:"
            echo "$status"
            exit 1
          fi

  openapi-contract:
    name: OpenAPI 3.1 developer contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install development-only upstream validator
        run: python -m pip install ".[dev]"
      - name: Validate generated OpenAPI, references and response examples
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=poc python -m unittest tests.test_openapi_spec_validator -v

  rdf-contract:
    name: RDFLib independent public export validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned RDFLib test dependency
        run: python -m pip install ".[dev]"
      - name: Assert validator version and parse, roundtrip, semantic parity
        run: |
          python -c "import rdflib; assert rdflib.__version__ == '7.6.0', rdflib.__version__"
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=poc python -m unittest tests.test_rdflib_validation tests.test_linked_data tests.test_dp436_public_statement_consumers -v

  feedparser-contract:
    name: Optional feedparser 6.0.14 strict discovery parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate default stdlib discovery
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=poc python -m unittest tests.test_source_watcher tests.test_source_adapters tests.test_public_rss_discovery tests.test_feedparser_backend -v
      - name: Install pinned optional donor
        run: python -m pip install ".[feeds]"
      - name: Validate pinned donor and complete discovery compatibility
        run: |
          python -c "import feedparser; assert feedparser.__version__ == '6.0.14'"
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=poc python -m unittest tests.test_source_watcher tests.test_source_adapters tests.test_public_rss_discovery tests.test_feedparser_backend -v

  web:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    name: web static frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Record tool versions
        run: |
          node -v
          npm -v

      - name: Install frontend dependencies from the lockfile
        working-directory: web
        run: npm ci

      - name: Type and Astro checks
        working-directory: web
        run: npm run check

      - name: Statement v3 API to frontend contract (synthetic release)
        working-directory: web
        run: node --experimental-strip-types scripts/check-statement-v3-api.mjs

      - name: DP438 first-class Person public route/index/sitemap and withdrawal
        working-directory: web
        run: node --experimental-strip-types scripts/check-dp438-public-consumer-v3.mjs

      - name: DP438 explicit rollback with retained v3 release paths
        working-directory: web
        run: node --experimental-strip-types scripts/check-dp438-optout-v3.mjs

      - name: Reviewed relation copy cannot infer positions
        working-directory: web
        run: npm run check:relations

      - name: Static build (fictional demo projection)
        working-directory: web
        env:
          DICHIARAZIONI_PUBBLICHE_ALLOW_DEMO_PROJECTION: "1"
        run: npm run build

      - name: Explicit public-projection build fails closed
        working-directory: web
        env:
          DICHIARAZIONI_PUBBLICHE_PUBLIC_PROJECTION_PATH: /nonexistent/invalid-projection.json
        # A wrong/missing explicit projection must NOT silently fall back to the demo
        # fixture; the frontend is fail-closed. This asserts the guard exists.
        run: |
          if DICHIARAZIONI_PUBBLICHE_PUBLIC_PROJECTION_PATH="$DICHIARAZIONI_PUBBLICHE_PUBLIC_PROJECTION_PATH" npm run build >/dev/null 2>&1; then
            echo "::error::build accepted an explicit but invalid projection; fail-closed guard is missing"
            exit 1
          fi
          echo "invalid explicit projection correctly rejected"

      - name: Reject disguised demo projections and verify isolated empty public build
        working-directory: web
        # Explicit opt-in demos must be noindex. A renamed fictional fixture is
        # never an approved public dataset; the isolated empty source is CI-only
        # and grants no live editorial/legal/release authority.
        run: npm run check:projection-boundary

  repository-contract:
    name: repository contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Deterministic contributor acceptance (repository + licensing + version)
        run: python3 tools/check_contributor_acceptance.py

      - name: DP-304 versioned field inventory rejects schema/privacy policy drift
        run: python3 tools/check_privacy_field_inventory.py

  clean-clone:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    name: detached clean-clone smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Independent of the job's working tree: proves the committed tree alone is
    # sufficient for the deterministic backend/package profile. The hosted checkout is
    # cloned locally so the proof stays pinned to the exact candidate commit.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install bounded packaging tooling
        run: python -m pip install --upgrade "pip>=24,<26" "build>=1.2,<2.0" "packaging>=24,<26" "setuptools>=68,<81" "wheel>=0.44,<0.46"

      - name: Install original-media test decoder
        run: |
          sudo sed -i \
              -e 's@mirror+file:/etc/apt/apt-mirrors.txt@http://archive.ubuntu.com/ubuntu@g' \
              -e 's@http://azure.archive.ubuntu.com/ubuntu@http://archive.ubuntu.com/ubuntu@g' \
              /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v ffmpeg
          command -v ffprobe

      - name: Clone to a scratch directory and run the backend/package profile
        # This job also runs DP-514's disposable PostgreSQL tests in a fresh
        # committed clone; use the same sanitized, opt-in wait witness as the
        # backend matrix so hosted 57014 cannot remain unattributed here.
        env:
          DP514_CI_PG_DIAGNOSTIC: "1"
          DP514_CI_PG_WAIT_WITNESS: "1"
        run: |
          set -euo pipefail
          SCRATCH="$(mktemp -d)"
          COMMIT="$(git rev-parse HEAD)"
          git clone --no-hardlinks --quiet . "$SCRATCH/clone"
          cd "$SCRATCH/clone"
          git checkout --detach --quiet "$COMMIT"
          echo "commit: $(git rev-parse HEAD)"
          test -z "$(git status --porcelain)" || { echo "clean-clone tree is dirty"; exit 1; }
          python3 -m compileall -q poc tests
          PYTHONPATH=poc python3 -m unittest discover -s tests
          media="$RUNNER_TEMP/dp419-jfk-original.ogg"
          curl --fail --location --silent --show-error --retry 2 --max-time 120 \
            'https://upload.wikimedia.org/wikipedia/commons/5/50/Jfk_rice_university_we_choose_to_go_to_the_moon.ogg' \
            --output "$media"
          DP419_REAL_MEDIA_PATH="$media" PYTHONPATH=poc python3 -m unittest tests.test_dp419_real_media_pg_acceptance -v
          PYTHONPATH=poc python3 -m dichiarazioni_pubbliche.benchmark
          python3 tools/check_contributor_acceptance.py
          python -m build --no-isolation --outdir "$SCRATCH/dist" .
          python -m venv "$SCRATCH/venv"
          "$SCRATCH/venv/bin/python" -m pip install "$SCRATCH"/dist/*.whl
          "$SCRATCH/venv/bin/python" -c "import dichiarazioni_pubbliche; print('clean-clone import ok:', dichiarazioni_pubbliche.__file__)"
          "$SCRATCH/venv/bin/python" -m dichiarazioni_pubbliche.benchmark --fixtures "$PWD/poc/fixtures/italian_cases.json"
          "$SCRATCH/venv/bin/dichiarazioni-pubbliche-review-admin" --help > /dev/null
          echo "clean-clone backend/package profile OK"

      - name: Reproducible package artifacts (DP-604)
        run: python3 tools/check_reproducible_package.py

      - name: Optional YouTube caption donor (offline only)
        run: |
          python3 -m pip install '.[youtube-captions]'
          python3 -c 'from importlib.metadata import version; from dichiarazioni_pubbliche.youtube_transcript_client import new_transcript_client; assert version("youtube-transcript-api") == "1.2.4"; assert callable(new_transcript_client().list)'
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=poc python3 -m unittest tests.test_platform_transcript tests.test_caption_adapter tests.test_transcript_api_integration tests.test_dp512_youtube_caption_reconciliation
