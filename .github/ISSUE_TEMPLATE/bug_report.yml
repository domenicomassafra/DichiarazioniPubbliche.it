name: Bug report
description: Report a reproducible software or data-contract defect
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and why it is incorrect.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal deterministic steps, fixtures, or commands.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: Provenance / affected record
      description: IDs, source URLs, hashes, or sanitized fixtures. Do not paste private/raw data.
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA or release version if known.
  - type: dropdown
    id: boundary
    attributes:
      label: Does this affect a publication or privacy boundary?
      options:
        - "No / unknown"
        - "Yes — public projection"
        - "Yes — review/approval gate"
        - "Yes — private/raw data exposure"
    validations:
      required: true
